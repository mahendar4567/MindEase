name: MindEase Complete Automated Test Suites & Excel Reports CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-all-tests-and-upload-artifacts:
    name: Run All Test Suites & Upload Master Excel Report
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: 📦 Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build || true

      - name: 🚀 Start Backend API Server in Background
        run: |
          cd backend
          node server.js &
          sleep 5

      - name: 🚀 Start Frontend Vite Server in Background
        run: |
          cd frontend
          npm run dev &
          sleep 5

      # -------------------------------------------------------------
      # TEST SUITES EXECUTION
      # -------------------------------------------------------------
      - name: 🧪 1. Run Backend API & Advanced Intelligence Test Suite
        continue-on-error: true
        run: |
          node tests-suite/api-tests.js

      - name: 🌐 2. Run Selenium Web E2E Test Suite (300 Test Cases)
        continue-on-error: true
        run: |
          cd selenium-tests
          npm install
          node tests/login-tests.js

      - name: 📱 3. Run Appium Mobile E2E Test Suite (300 Test Cases)
        continue-on-error: true
        run: |
          cd appium-tests
          npm install
          node tests/app-e2e-tests.js

      - name: ⚡ 4. Run 100 Virtual Users Baseline Load Test Suite
        continue-on-error: true
        run: |
          cd load-tests
          npm install
          DURATION=15 node baseline-load-test.js

      - name: 📊 5. Generate Master Consolidated Excel Report Workbook
        continue-on-error: true
        run: |
          cd selenium-tests
          node generate-master-excel-report.js

      # -------------------------------------------------------------
      # ARTIFACT UPLOAD: Master Downloadable Excel Workbook in GitHub
      # -------------------------------------------------------------
      - name: 📤 Upload Master Consolidated Excel Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MindEase-Master-Complete-Test-Report-Excel
          path: |
            MindEase_Master_Complete_Test_Report.xlsx
            selenium-tests/MindEase_E2E_Test_Report_300.xlsx
            appium-tests/MindEase_Appium_E2E_Test_Report_300.xlsx
            load-tests/MindEase_Baseline_Load_Test_Report.xlsx
          retention-days: 30
